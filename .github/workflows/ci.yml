name: FfeD-QLC validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffed-qlc-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    name: Tests and public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install package dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "setuptools>=83"
          python -m pip install -e ".[dev,alpha]"

      - name: Run public unit tests with package dependencies
        run: python -m pytest

      - name: Enforce critical closure coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=src/ffed_qlc -m pytest tests/test_fqlc2.py tests/test_alpha_api.py tests/test_closure_controls.py
          python -m coverage report --include='*fqlc2.py,*api_security.py,*identity.py,*native_handoff.py' --fail-under=90

      - name: Audit Python dependencies
        run: python -m pip_audit --local --progress-spinner off

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and test frontend
        run: |
          npm run test:unit
          npm run build
          npm run smoke:frontend
          npm audit --audit-level=high

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser tests
        run: npm run test:e2e

      - name: Validate public-safe boundary
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          required = {
              "README.md": ["no real `.env` files", "no API keys", "no medical/clinical guidance"],
              "SECURITY.md": ["Do not commit", "API keys", "This MVP is not a production cryptographic system"],
          }
          problems = []
          for path, snippets in required.items():
              text = (root / path).read_text(encoding="utf-8")
              for snippet in snippets:
                  if snippet not in text:
                      problems.append(f"{path}: missing {snippet!r}")
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_paths = {".env", ".env.local", ".env.production", "id_rsa", "id_ed25519"}
          for path in tracked:
              if path.lower() in forbidden_paths:
                  problems.append(f"tracked forbidden secret-bearing path: {path}")
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |DSA |EC |OPENSSH |)PRIVATE KEY-----"),
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"gh[pousr]_[A-Za-z0-9_]{30,}"),
          ]
          for path in tracked:
              p = root / path
              if p.suffix.lower() not in {".md", ".py", ".toml", ".yml", ".yaml", ".txt", ".cff"} and p.name not in {"Dockerfile"}:
                  continue
              try:
                  text = p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for pattern in secret_patterns:
                  if pattern.search(text):
                      problems.append(f"{path}: possible committed secret matched {pattern.pattern}")
          if problems:
              print("Public-boundary validation failed:", file=sys.stderr)
              print("\n".join(f"- {p}" for p in problems), file=sys.stderr)
              raise SystemExit(1)
          print("Public-boundary validation passed")
          PY

      - name: Record CI result locally
        if: always()
        env:
          CI_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          state = os.environ.get("CI_JOB_STATUS", "unknown")
          record = {"schema": "securedme.ci.result.v1", "component": "ffed-qlc", "status": state}
          Path("ci-result.json").write_text(json.dumps(record, sort_keys=True), encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"FfeD-QLC validation result: **{state}**.\n")
          PY

      - name: Keep CI result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffed-qlc-ci-result
          path: ci-result.json
          retention-days: 7
